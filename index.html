<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLV Logo Final</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Outfit', sans-serif;
    gap: 64px;
    padding: 56px 24px;
  }

  .label {
    color: #3a3a3a;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
    text-align: center;
  }

  .card { display: flex; flex-direction: column; align-items: center; }

  /* ─── LOGO ROW ─── */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  /* Icon box */
  .icon-box {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    background: linear-gradient(160deg, #FF6B1A 0%, #FFA825 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Wordmark */
  .wordmark {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    color: #ffffff;
  }

  .wordmark .v {
    background: linear-gradient(160deg, #FF6B1A 0%, #FFA825 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 14px;
    color: #444;
  }

  /* ─── WHITE BG ─── */
  .card-white {
    background: #f5f5f5;
    padding: 44px 72px;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wordmark-dark {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    color: #111111;
  }

  .wordmark-dark .v {
    background: linear-gradient(160deg, #FF6B1A 0%, #FFA825 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ─── ICON ONLY ─── */
  .icon-only {
    width: 110px;
    height: 110px;
    border-radius: 28px;
    background: linear-gradient(160deg, #FF6B1A 0%, #FFA825 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ─── COMPACT ─── */
  .compact-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-sm {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(160deg, #FF6B1A 0%, #FFA825 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .wordmark-sm {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1.5px;
    color: #ffffff;
    line-height: 1;
  }

  .wordmark-sm .v {
    background: linear-gradient(160deg, #FF6B1A 0%, #FFA825 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .row { display: flex; align-items: center; gap: 56px; }
  .divider { width: 1px; height: 80px; background: #1e1e1e; }

  /* ─── PALETTE ─── */
  .palette { display: flex; gap: 16px; margin-top: 20px; }
  .swatch {
    width: 44px; height: 44px; border-radius: 50%;
    position: relative;
  }
  .swatch::after {
    content: attr(data-hex);
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: #3a3a3a;
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- ① PRIMARY — DARK -->
<div class="card">
  <div class="label">Primary — Dark</div>
  <div class="logo-row">
    <div class="icon-box">
      <svg width="44" height="60" viewBox="0 0 36 56" fill="none">
        <path d="M23 2L5 30H18L13 54L33 22H20L23 2Z" fill="white"/>
      </svg>
    </div>
    <div class="wordmark">SOL<span class="v">V</span></div>
  </div>
  <div class="tagline">Bantuan Serba Bisa</div>
</div>

<!-- ② PRIMARY — LIGHT -->
<div class="card">
  <div class="label">Primary — Light</div>
  <div class="card-white">
    <div class="logo-row">
      <div class="icon-box">
        <svg width="44" height="60" viewBox="0 0 36 56" fill="none">
          <path d="M23 2L5 30H18L13 54L33 22H20L23 2Z" fill="white"/>
        </svg>
      </div>
      <div class="wordmark-dark">SOL<span class="v">V</span></div>
    </div>
  </div>
</div>

<!-- ③ ICON ONLY + COMPACT -->
<div class="card">
  <div class="label">Icon Only &amp; Compact</div>
  <div class="row">

    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <div class="icon-only">
        <svg width="60" height="80" viewBox="0 0 36 56" fill="none">
          <path d="M23 2L5 30H18L13 54L33 22H20L23 2Z" fill="white"/>
        </svg>
      </div>
      <div class="label" style="margin:0">App Icon</div>
    </div>

    <div class="divider"></div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div class="compact-row">
        <div class="icon-sm">
          <svg width="22" height="30" viewBox="0 0 36 56" fill="none">
            <path d="M23 2L5 30H18L13 54L33 22H20L23 2Z" fill="white"/>
          </svg>
        </div>
        <div class="wordmark-sm">SOL<span class="v">V</span></div>
      </div>
      <div class="label" style="margin:0">Compact / WA</div>
    </div>

  </div>
</div>

<!-- ④ BRAND COLORS -->
<div class="card">
  <div class="label">Brand Colors</div>
  <div class="palette">
    <div class="swatch" style="background:#FF6B1A" data-hex="#FF6B1A"></div>
    <div class="swatch" style="background:#FFA825" data-hex="#FFA825"></div>
    <div class="swatch" style="background:#111111;border:1px solid #2a2a2a" data-hex="#111111"></div>
    <div class="swatch" style="background:#FFFFFF;border:1px solid #2a2a2a" data-hex="#FFFFFF"></div>
  </div>
</div>

</body>
</html>
